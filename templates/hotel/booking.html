{% extends "base.html" %}
{% block title %}
  Бронирование {{ room.title }}
{% endblock %}
{% block content %}
  <div class="col d-flex justify-content-center">
    <div class="card" style="width: 40rem;">
      <div class="card-body">
        <h5 class="card-title">Бронирование: {{ room.title }}</h5>
        <p class="card-text">Цена: {{ room.price }} руб. | Вместимость: {{ room.capacity }}</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.check_in.id_for_label }}" class="form-label">Дата заезда</label>
            {{ form.check_in }}
          </div>
          <div class="mb-3">
            <label for="{{ form.check_out.id_for_label }}" class="form-label">Дата выезда</label>
            {{ form.check_out }}
          </div>
          <button type="submit" class="btn btn-primary">Забронировать</button>
          <a href="{% url 'hotel:room_detail' room.slug %}" class="btn btn-secondary">Отмена</a>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
